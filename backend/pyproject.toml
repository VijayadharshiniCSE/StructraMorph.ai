[project]
name = "structramorph-backend"
version = "0.1.0"
description = "StructraMorph.ai Precision Document Parsing and Surgical AI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "pytesseract==0.3.13",
    "Pillow==10.4.0",
    "reportlab>=4.0.0",
    "openai==1.51.0",
    "tinydb==4.8.0",
]

[tool.vercel]
entrypoint = "app.main:app"
